name = "calorie-bot"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[vars]
OWNER_ID = "000000000"                          # ваш Telegram ID (узнать: команда /id в боте)
WEBAPP_URL = "https://USERNAME.github.io/calorie-bot/"  # адрес мини-приложения (GitHub Pages)
SUPPORT_URL = "https://example.com/thanks"      # ссылка для благодарности (СБП, Boosty, CloudTips…)
SUPPORT_WEBAPP = "0"                            # "1" — открывать страницу благодарности внутри Telegram

[[d1_databases]]
binding = "DB"
database_name = "calorie-bot"
database_id = "PASTE_DATABASE_ID"
