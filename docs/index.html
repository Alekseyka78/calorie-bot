<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор калорий блюда</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#1c2330;--hint:#7b8594;--line:#e3e7ee;
  --accent:#2f80ed;--accent-t:#fff;--ok:#27ae60;--danger:#e5484d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--text:#e8edf4;--hint:#8a95a5;--line:#2a3340;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--tg-theme-bg-color,var(--bg));color:var(--tg-theme-text-color,var(--text));
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:16px 14px calc(44px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--hint);font-size:14px;margin:0 0 14px}
.card{background:var(--tg-theme-secondary-bg-color,var(--card));border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.head,.row{display:grid;grid-template-columns:1fr 70px 78px 26px;gap:6px;align-items:center}
.head{font-size:12px;color:var(--hint);margin-bottom:6px;padding:0 2px}
.row{margin-bottom:8px}
.ac{position:relative;min-width:0}
input{width:100%;min-width:0;font:inherit;color:inherit;background:var(--tg-theme-bg-color,var(--bg));
  border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none}
input:focus{border-color:var(--tg-theme-button-color,var(--accent))}
input.num{text-align:right}
.sug{display:none;position:absolute;left:0;right:-60px;top:100%;margin-top:4px;z-index:20;max-height:230px;overflow-y:auto;
  background:var(--tg-theme-secondary-bg-color,var(--card));border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sug div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--line)}
.sug div:last-child{border-bottom:0}
.sug div:hover,.sug div.on{background:var(--tg-theme-bg-color,var(--bg))}
.sug small{color:var(--hint);white-space:nowrap}
.del{border:0;background:none;color:var(--hint);font-size:22px;line-height:1;cursor:pointer;padding:0}
.del:hover{color:var(--danger)}
.rk{font-size:12px;color:var(--hint);margin:-4px 0 2px 2px;min-height:0}
.btn{width:100%;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:600;cursor:pointer;
  background:var(--tg-theme-button-color,var(--accent));color:var(--tg-theme-button-text-color,var(--accent-t))}
.btn.ghost{background:none;color:var(--hint);font-weight:500;margin-top:6px}
label.f{display:block;font-size:13px;color:var(--hint);margin-bottom:6px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--tg-theme-bg-color,var(--bg));border-radius:12px;padding:12px;text-align:center}
.box b{display:block;font-size:26px;color:var(--tg-theme-button-color,var(--accent))}
.box span{font-size:12px;color:var(--hint)}
.box.big{grid-column:1/-1}
.box.big b{font-size:32px;color:var(--ok)}
.save{display:flex;gap:8px;margin-bottom:8px}
.save .btn{width:auto;padding:9px 16px}
.msg{font-size:13px;color:var(--hint);min-height:18px;margin-bottom:8px}
.empty{font-size:13px;color:var(--hint)}
.dish{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--tg-theme-bg-color,var(--bg))}
.dish span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish small{color:var(--hint);white-space:nowrap}
.sig{position:fixed;left:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--hint);opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍲 Калорийность блюда</h1>
  <p class="sub">Начните вводить продукт и выберите из списка — ккал подставятся сами. Можно ввести своё значение.</p>

  <div class="card">
    <div class="head"><span>Продукт</span><span style="text-align:right">Вес, г</span><span style="text-align:right">Ккал/100 г</span><span></span></div>
    <div id="rows"></div>
    <button class="btn" id="add">+ Добавить продукт</button>
    <button class="btn ghost" id="clear">Очистить всё</button>
  </div>

  <div class="card">
    <label class="f" for="cooked">Вес готового блюда, г (необязательно — после варки/жарки вес меняется)</label>
    <input class="num" id="cooked" type="number" inputmode="decimal" min="0" placeholder="например, 1200">
  </div>

  <div class="card res">
    <div class="box"><b id="tw">0</b><span>вес продуктов, г</span></div>
    <div class="box"><b id="tk">0</b><span>ккал во всём блюде</span></div>
    <div class="box big"><b id="k100">0</b><span id="k100l">ккал на 100 г</span></div>
  </div>

  <div class="card">
    <label class="f" for="dname">📒 Мои блюда — сохраните состав, чтобы не вводить заново</label>
    <div class="save"><input id="dname" maxlength="60" placeholder="Название блюда"><button class="btn" id="save">Сохранить</button></div>
    <div class="msg" id="dmsg"></div>
    <div id="dishes"></div>
  </div>
</div>
<div class="sig">© @AlekseyKa78</div>

<script>
try{var tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();}}catch(e){}

// Ккал на 100 г (сырые продукты, средние значения). Формат: «Название|ккал»
var RAW=[
// Молочные
"Молоко 0.5%|35","Молоко 1%|40","Молоко 1.5%|44","Молоко 2.5%|52","Молоко 3.2%|59","Молоко 3.5%|62","Молоко 6%|84","Молоко сгущённое|320","Молоко сухое|476",
"Сметана 10%|116","Сметана 15%|158","Сметана 20%|206","Сметана 25%|248","Сметана 30%|294",
"Сливки 10%|118","Сливки 20%|205","Сливки 33%|322","Сливки 35%|337",
"Творог 0%|71","Творог 2%|103","Творог 5%|121","Творог 9%|169","Творог 18%|232",
"Кефир 1%|40","Кефир 2.5%|53","Кефир 3.2%|59","Ряженка 4%|67","Йогурт натуральный|66","Йогурт греческий|115",
"Сыр твёрдый (Российский)|364","Сыр Голландский|352","Сыр Пармезан|392","Сыр Моцарелла|240","Сыр Сулугуни|290",
"Сыр Фета|264","Сыр Брынза|260","Сыр плавленый|270","Сыр Рикотта|174","Сыр Маскарпоне|429","Сыр Чеддер|406",
// Масла и соусы
"Масло сливочное 82.5%|748","Масло сливочное 72.5%|661","Масло топлёное|892","Масло подсолнечное|899","Масло оливковое|898",
"Масло кокосовое|892","Маргарин|743","Майонез Провансаль 67%|627","Майонез лёгкий 30%|300","Кетчуп|93","Горчица|143",
"Соевый соус|53","Томатная паста|82","Уксус 9%|11",
// Мясо и птица
"Говядина|187","Говядина постная|158","Телятина|90","Свинина|259","Свинина постная (вырезка)|142","Свинина шея|262",
"Баранина|209","Курица целая|190","Куриная грудка|113","Куриное бедро|185","Куриная голень|158","Куриные крылья|186",
"Индейка филе|114","Индейка бедро|144","Утка|346","Кролик|183","Печень говяжья|127","Печень куриная|137","Сердце куриное|159",
"Фарш говяжий|254","Фарш свиной|263","Фарш смешанный|257","Фарш куриный|143","Фарш индейки|150",
"Сосиски|266","Колбаса варёная|257","Ветчина|270","Бекон|500","Сало|797","Тушёнка говяжья|232",
// Рыба и морепродукты
"Треска|78","Минтай|72","Хек|86","Горбуша|142","Лосось (сёмга)|208","Форель|97","Скумбрия|191","Сельдь|217",
"Тунец консервированный|96","Сардина в масле|220","Креветки|87","Кальмар|75","Мидии|77","Икра красная|252","Крабовые палочки|73",
// Яйца
"Яйцо куриное (целое)|157","Яйцо куриное (желток)|352","Яйцо куриное (белок)|45","Яйцо перепелиное|168",
// Крупы, мука, хлеб
"Рис белый|333","Рис бурый|337","Гречка|313","Овсяные хлопья|352","Пшено|348","Перловка|324","Манная крупа|328",
"Кукурузная крупа|325","Булгур|342","Кускус|376","Чечевица|295","Нут|364","Фасоль сухая|298","Горох сухой|298",
"Макароны|344","Вермишель|340","Лапша яичная|386","Мука пшеничная|334","Мука ржаная|298","Крахмал|313",
"Хлеб белый|242","Хлеб ржаной|214","Панировочные сухари|395","Сахар|399","Мёд|329","Соль|0","Вода|0",
// Овощи, грибы, зелень
"Картофель|77","Морковь|32","Лук репчатый|41","Лук зелёный|19","Чеснок|143","Капуста белокочанная|27","Капуста цветная|25",
"Брокколи|34","Свёкла|43","Помидоры|20","Огурцы|15","Перец болгарский|27","Кабачок|24","Баклажан|24","Тыква|22",
"Редис|19","Шпинат|23","Сельдерей корень|42","Фасоль стручковая|31","Кукуруза консервированная|119",
"Горошек зелёный консервированный|40","Грибы шампиньоны|27","Грибы вешенки|33","Грибы белые|34","Оливки|115",
"Укроп|40","Петрушка|49","Имбирь|80",
// Фрукты, орехи, прочее
"Яблоко|47","Банан|96","Апельсин|43","Лимон|34","Груша|42","Виноград|65","Клубника|33","Изюм|264","Курага|232","Чернослив|231","Финики|292",
"Орехи грецкие|654","Миндаль|609","Арахис|551","Фундук|628","Кешью|600","Семечки подсолнечные|601","Кунжут|565",
"Шоколад тёмный|540","Какао-порошок|289","Кокосовое молоко|197","Тофу|76"
];
function norm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim()}
var FOODS=RAW.map(function(s){var p=s.split('|');return {n:p[0],k:+p[1],q:norm(p[0])}});

var rows=document.getElementById('rows');
function num(v){v=parseFloat(String(v).replace(',','.'));return isFinite(v)&&v>0?v:0}
function fmt(n){return (Math.round(n*10)/10).toLocaleString('ru-RU')}

function find(q){
  q=norm(q);if(!q)return [];
  var t=q.split(' '),res=[];
  FOODS.forEach(function(f){
    for(var i=0;i<t.length;i++){if(f.q.indexOf(t[i])<0)return;}
    res.push({f:f,s:f.q.indexOf(q)===0?0:(f.q.indexOf(' '+t[0])>=0?1:2)});
  });
  res.sort(function(a,b){return a.s-b.s});
  return res.slice(0,10).map(function(r){return r.f});
}

function closeAll(except){
  document.querySelectorAll('.sug').forEach(function(s){if(s!==except)s.style.display='none'});
}

function addRow(){
  var r=document.createElement('div');
  r.innerHTML='<div class="row">'+
    '<div class="ac"><input class="nm" autocomplete="off" placeholder="Начните вводить…"><div class="sug"></div></div>'+
    '<input class="num w" type="number" inputmode="decimal" min="0" placeholder="г">'+
    '<input class="num k" type="number" inputmode="decimal" min="0" placeholder="ккал">'+
    '<button class="del" title="Удалить">×</button></div><div class="rk"></div>';
  rows.appendChild(r);
  var nm=r.querySelector('.nm'),k=r.querySelector('.k'),w=r.querySelector('.w'),sug=r.querySelector('.sug');

  function pick(f){
    nm.value=f.n;k.value=f.k;k.dataset.auto='1';
    sug.style.display='none';calc();w.focus();
  }
  function show(){
    var list=find(nm.value);
    if(!list.length){sug.style.display='none';return;}
    sug.innerHTML='';
    list.forEach(function(f){
      var d=document.createElement('div');
      d.innerHTML='<span></span><small>'+f.k+' ккал</small>';
      d.firstChild.textContent=f.n;
      d.addEventListener('pointerdown',function(e){e.preventDefault();pick(f);});
      sug.appendChild(d);
    });
    closeAll(sug);sug.style.display='block';
  }
  nm.addEventListener('input',function(){
    var q=norm(nm.value),hit=null;
    FOODS.forEach(function(f){if(f.q===q)hit=f;});
    if(hit&&(!k.value||k.dataset.auto)){k.value=hit.k;k.dataset.auto='1';}
    show();calc();
  });
  nm.addEventListener('focus',function(){if(nm.value)show();});
  nm.addEventListener('keydown',function(e){
    if(e.key==='Enter'){var l=find(nm.value);if(l.length){e.preventDefault();pick(l[0]);}}
  });
  k.addEventListener('input',function(){delete k.dataset.auto;calc();});
  w.addEventListener('input',calc);
  r.querySelector('.del').onclick=function(){r.remove();if(!rows.children.length)addRow();calc();};
  return r;
}
document.addEventListener('pointerdown',function(e){if(!e.target.closest('.ac'))closeAll();});

function calc(){
  var tw=0,tk=0;
  Array.prototype.forEach.call(rows.children,function(r){
    var w=num(r.querySelector('.w').value),k=num(r.querySelector('.k').value);
    var kc=w*k/100;tw+=w;tk+=kc;
    r.querySelector('.rk').textContent=(w&&k)?('≈ '+fmt(kc)+' ккал'):'';
  });
  var cooked=num(document.getElementById('cooked').value);
  var base=cooked||tw;
  document.getElementById('tw').textContent=fmt(tw);
  document.getElementById('tk').textContent=fmt(tk);
  document.getElementById('k100').textContent=base?fmt(tk/base*100):'0';
  document.getElementById('k100l').textContent=cooked?'ккал на 100 г готового блюда':'ккал на 100 г';
}

document.getElementById('add').onclick=function(){addRow().querySelector('.nm').focus();};
document.getElementById('clear').onclick=function(){rows.innerHTML='';document.getElementById('cooked').value='';dname.value='';say('');addRow();calc();};
document.getElementById('cooked').addEventListener('input',calc);
addRow();addRow();addRow();calc();

// ---------- Мои блюда ----------
// В Telegram блюда хранятся в облаке Telegram (общие для всех устройств), в браузере — в localStorage
var WA=window.Telegram&&Telegram.WebApp;
var CS=(WA&&WA.CloudStorage&&WA.isVersionAtLeast&&WA.isVersionAtLeast('6.9'))?WA.CloudStorage:null;
var PFX='d_';
var store={
  list:function(cb){
    if(CS){
      CS.getKeys(function(e,keys){
        keys=(keys||[]).filter(function(k){return k.indexOf(PFX)===0});
        if(e||!keys.length){cb([]);return;}
        CS.getItems(keys,function(e2,vals){
          var out=[];
          if(!e2&&vals)keys.forEach(function(k){try{var o=JSON.parse(vals[k]);o.key=k;out.push(o);}catch(x){}});
          cb(out);
        });
      });
    }else{
      var out=[];
      try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
        if(k.indexOf(PFX)===0){try{var o=JSON.parse(localStorage.getItem(k));o.key=k;out.push(o);}catch(x){}}}}catch(x){}
      cb(out);
    }
  },
  set:function(k,o,cb){
    var s=JSON.stringify(o);
    if(s.length>4000){cb(false);return;}
    if(CS)CS.setItem(k,s,function(e,ok){cb(!e&&!!ok);});
    else{try{localStorage.setItem(k,s);cb(true);}catch(x){cb(false);}}
  },
  del:function(k,cb){
    if(CS)CS.removeItem(k,function(){cb();});
    else{try{localStorage.removeItem(k);}catch(x){}cb();}
  }
};
var dishList=document.getElementById('dishes'),dmsg=document.getElementById('dmsg'),dname=document.getElementById('dname'),DISHES=[];
function say(t){dmsg.textContent=t;}
function dishKcal(d){var tw=0,tk=0;d.i.forEach(function(x){tw+=x[1];tk+=x[1]*x[2]/100;});var b=d.c||tw;return b?Math.round(tk/b*100):0;}
function render(){
  dishList.innerHTML='';
  if(!DISHES.length){dishList.innerHTML='<div class="empty">Пока нет сохранённых блюд.</div>';return;}
  DISHES.sort(function(a,b){return a.n.localeCompare(b.n,'ru')});
  DISHES.forEach(function(d){
    var el=document.createElement('div');el.className='dish';
    el.innerHTML='<span></span><small>'+dishKcal(d)+' ккал/100 г</small><button class="del" title="Удалить">×</button>';
    el.firstChild.textContent=d.n;
    el.addEventListener('click',function(){loadDish(d);});
    el.querySelector('.del').addEventListener('click',function(e){
      e.stopPropagation();
      store.del(d.key,function(){DISHES=DISHES.filter(function(x){return x.key!==d.key});render();say('Удалено');});
    });
    dishList.appendChild(el);
  });
}
function loadDish(d){
  rows.innerHTML='';
  d.i.forEach(function(x){var r=addRow();r.querySelector('.nm').value=x[0];r.querySelector('.w').value=x[1]||'';r.querySelector('.k').value=x[2]||'';});
  if(!rows.children.length)addRow();
  document.getElementById('cooked').value=d.c||'';dname.value=d.n;calc();say('Загружено: '+d.n);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('save').onclick=function(){
  var name=dname.value.trim();
  if(!name){say('Введите название блюда');dname.focus();return;}
  var ing=[];
  Array.prototype.forEach.call(rows.children,function(r){
    var n=r.querySelector('.nm').value.trim(),w=num(r.querySelector('.w').value),k=num(r.querySelector('.k').value);
    if(w)ing.push([n||'Продукт',w,k]);
  });
  if(!ing.length){say('Добавьте продукты с весом');return;}
  var ex=DISHES.filter(function(d){return d.n.toLowerCase()===name.toLowerCase()})[0];
  var key=ex?ex.key:PFX+Date.now().toString(36);
  var obj={n:name,c:num(document.getElementById('cooked').value),i:ing};
  store.set(key,obj,function(ok){
    if(!ok){say('Не удалось сохранить: слишком большой состав или нет доступа');return;}
    obj.key=key;DISHES=DISHES.filter(function(d){return d.key!==key});DISHES.push(obj);render();
    say(ex?'Блюдо обновлено ✓':'Блюдо сохранено ✓');
  });
};
store.list(function(l){DISHES=l;render();});
</script>

</body>
</html>
